<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙欄瀑布流看盤 Dashboard</title>
    <style>
        /* 基礎樣式：允許整頁隨著圖表增加而自由往下滾動 */
        html, body {
            margin: 0;
            padding: 15px;
            background-color: #0F0F0F;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
        }

        /* 建立左右雙欄格線架構 */
        .chart-grid {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            gap: 20px; /* 每張圖表之間的左右與上下間距 */
        }

        /* 每一格圖表的容器：左右各佔 50% 寬度 (扣除 gap 間距) */
        .chart-box {
            width: calc(50% - 10px);
            height: 500px; /* 每張圖表的高度，你可以自由調大或調小 */
            box-sizing: border-box;
            background-color: #0F0F0F;
        }

        /* 手機等窄螢幕時，自動變成單欄排版 */
        @media (max-width: 900px) {
            .chart-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="chart-grid">

        <!-- ==================== 🎯 第 1 格：美金兌台幣 (USDTWD) ==================== -->
        <div class="chart-box">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <div class="tradingview-widget-copyright"><a href="https://tradingview.com" rel="noopener nofollow" target="_blank"><span class="blue-text">USDTWD 線圖</span></a><span class="trademark"> 由 TradingView 提供</span></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                    "allow_symbol_change": true,
                    "calendar": false,
                    "details": false,
                    "hide_side_toolbar": false,
                    "hide_top_toolbar": false,
                    "hide_legend": false,
                    "hide_volume": false,
                    "hotlist": false,
                    "interval": "D",
                    "locale": "zh_TW",
                    "save_image": true,
                    "style": "1",
                    "symbol": "FX_IDC:USDTWD",
                    "theme": "dark",
                    "timezone": "Asia/Taipei",
                    "backgroundColor": "#0F0F0F",
                    "gridColor": "rgba(242, 242, 242, 0.2)",
                    "watchlist": [],

                    "autosize": true
