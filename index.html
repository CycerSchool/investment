<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙欄瀑布流看盤 Dashboard</title>
    <style>
        /* 基礎樣式：允許整頁上下滾動 */
        html, body {
            margin: 0;
            padding: 10px;
            background-color: #0F0F0F;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            box-sizing: border-box;
        }

        /* 雙欄並排架構 */
        .chart-grid {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            gap: 15px; /* 每張圖表之間的間距 */
        }

        /* 每一格圖表的容器：寬度各佔接近 50% (扣除 gap) */
        .chart-box {
            width: calc(50% - 8px);
            height: 450px; /* 每張圖表的高度 */
            border: 1px solid #2a2e39;
            border-radius: 6px;
            overflow: hidden;
            background-color: #131722;
            box-sizing: border-box;
        }

        /* 當螢幕太窄(例如手機)時，自動變成單欄 */
        @media (max-width: 768px) {
            .chart-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="chart-grid">

        <!-- 第 1 格：美金兌台幣 (USDTWD) -->
        <div class="chart-box">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                    "autosize": true,
                    "symbol": "FX_IDC:USDTWD",
                    "interval": "D",
                    "timezone": "Asia/Taipei",
                    "theme": "dark",
                    "style": "1",
                    "locale": "zh_TW",
                    "allow_symbol_change": true
                }
                </script>
            </div>
        </div>

        <!-- 第 2 格：台灣加權指數 (TAIEX) -->
        <div class="chart-box">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                    "autosize": true,
                    "symbol": "TWSE:TAIEX",
                    "interval": "D",
                    "timezone": "Asia/Taipei",
                    "theme": "dark",
                    "style": "1",
                    "locale": "zh_TW",
                    "allow_symbol_change": true
                }
                </script>
            </div>
        </div>

        <!-- 第 3 格：歐元兌台幣 (EURTWD) -->
        <div class="chart-box">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                    "autosize": true,
                    "symbol": "FX_IDC:EURTWD",
                    "interval": "D",
                    "timezone": "Asia/Taipei",
                    "theme": "dark",
                    "style": "1",
                    "locale": "zh_TW",
                    "allow_symbol_change": true
                }
                </script>
            </div>
        </div>

        <!-- 第 4 格：日圓兌台幣 (JPYTWD) -->
        <div class="chart-box">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://tradingview.com" async>
                {
                    "autosize": true,
                    "symbol": "FX_IDC:JPYTWD",
                    "interval": "D",
                    "timezone": "Asia/Taipei",
                    "theme": "dark",
                    "style": "1",
                    "locale": "zh_TW",
                    "allow_symbol_change": true
                }
                </script>
            </div>
        </div>

        <!-- 💡 未來你想加第 5、6 張圖，直接複製下方的區塊往後貼，改 "symbol" 即可，網頁會自動排成左右往下加的狀態 -->

    </div>

</body>
</html>
