<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外匯即時監控 Dashboard</title>
    <style>
        /* 讓 Dashboard 自動填滿整個瀏覽器畫面 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0F0F0F;
            overflow: hidden;
        }
    </style>
</head>
<body>

<!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container" style="height:100%;width:100%">
  <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
  <div class="tradingview-widget-copyright"><a href="https://tradingview.com" rel="noopener nofollow" target="_blank"><span class="blue-text">USDTWD 線圖</span></a><span class="trademark"> 由 TradingView 提供</span></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
  {
  "allow_symbol_change": true,
  "calendar": false,
  "details": false,
  "hide_side_toolbar": false,
  "hide_top_toolbar": false,
  "hide_legend": false,
  "hide_volume": false,
  "hotlist": false,
  "interval": "D",
  "locale": "zh_TW",
  "save_image": true,
  "style": "1",
  "symbol": "FX_IDC:USDTWD",
  "theme": "dark",
  "timezone": "Asia/Taipei",
  "backgroundColor": "#0F0F0F",
  "gridColor": "rgba(242, 242, 242, 0.2)",
  "watchlist": [],
  "withdateranges": true,
  "compareSymbols": [],
  "support_host": "https://www.tradingview.com",
  "studies": [],
  "autosize": true
}
  </script>
</div>
<!-- TradingView Widget END -->

</body>
</html>
